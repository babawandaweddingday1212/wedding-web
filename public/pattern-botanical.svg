<!--
  背景花紋：座頭鯨、香蒲蘆葦、百合的線稿。大尺寸版本。

  圖案畫在各自約 60~125 單位的空間裡，擺放時再放大 4.5~8 倍。
  描邊必須跟著倍率反向縮小（stroke-width = 1.8 ÷ 倍率），
  不然放大幾倍線就粗幾倍，整張糊成一團。

  一格只放五個圖案。放大之後單一圖案就佔掉螢幕一大塊，
  照小圖的密度擺會整片塞滿，反而看不出畫的是什麼。

  無縫接合：把整組圖案往八個方向各複製一份（上下左右與四個角），
  跨過邊界的線條就會在對邊接回來 —— 只畫格子內部的話，
  拼接處會看得出一條空白帶。

  顏色偏暖褐，實際濃度由 CSS 的 opacity 控制。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1400" viewBox="0 0 1400 1400">
  <defs>
    <!-- 座頭鯨，頭朝右。外輪廓是一筆畫完的：
         尾鰭上葉 → 中央缺刻 → 尾鰭下葉 → 尾柄 → 腹部 → 頭 → 背 → 回尾柄。
         重點是頭鈍而飽滿、尾柄收得很細、尾鰭兩葉之間要有缺刻，
         再加一支長胸鰭 —— 少了胸鰭就只是一條大魚。約 125×60。 -->
    <g id="whale">
      <!-- 身體：右端是飽滿的鈍頭，往左一路收細成很窄的尾柄。
           兩端一樣尖的話就只是一條魚。 -->
      <path d="M18,32
               C34,18 58,10 82,11
               C104,12 122,20 126,33
               C122,46 104,55 82,56
               C58,58 34,48 18,36 Z" />
      <!-- 尾鰭獨立成一個封閉形狀。之前想併進身體的輪廓一筆畫完，
           前後緣的曲線互相抵消，結果塌成一根刺。分開畫才控制得住：
           右側窄處接尾柄，左側張成上下兩葉，中間留一個缺刻。 -->
      <path d="M20,32
               C10,24 -2,14 -12,4
               C-8,14 -3,25 2,34
               C-3,43 -8,53 -10,62
               C-1,52 10,44 20,38 Z" />
      <!-- 長胸鰭：座頭鯨的招牌，往腹下後方長長伸出。
           少了這一支，剩下的輪廓就只是一條大魚。 -->
      <path d="M86,52 C80,66 68,77 52,82 C56,71 64,60 74,50 Z" />
      <!-- 背鰭：座頭鯨的背鰭很小，只是背上一個矮丘 -->
      <path d="M36,17 C40,9 46,6 52,10 C47,11 42,14 39,18 Z" />
      <!-- 嘴線與兩道喉腹褶 -->
      <path d="M126,34 C116,39 104,43 92,45" />
      <path d="M112,47 C108,42 104,39 99,36" />
      <path d="M101,51 C98,46 94,43 89,40" />
      <circle cx="114" cy="28" r="1.6" />
    </g>

    <!-- 香蒲：棒狀花穗立在細莖上，底下散開細長的葉。
         單一根會太單薄，所以一叢放三根、高度與角度都不同；
         葉子從同一個基部往外放射，長短要差得夠開。約 56×86。 -->
    <g id="cattail-stalk">
      <path d="M0,0 C1,-16 2,-32 3,-45" />
      <path d="M3,-45 C-2,-46 -4,-52 -4,-59 C-4,-68 -1,-74 3,-75 C7,-74 10,-68 10,-59 C10,-52 8,-46 3,-45 Z" />
      <path d="M3,-75 C4,-80 5,-84 7,-88" />
    </g>

    <g id="reed">
      <use href="#cattail-stalk" transform="rotate(-7)" />
      <use href="#cattail-stalk" transform="translate(11 -2) rotate(5) scale(0.92)" />
      <use href="#cattail-stalk" transform="translate(23 1) rotate(16) scale(0.82)" />
      <path d="M0,0 C-11,-24 -16,-50 -13,-74 C-3,-50 3,-24 5,-2 Z" />
      <path d="M5,0 C13,-26 18,-54 16,-80 C8,-54 3,-26 1,-1 Z" />
      <path d="M8,0 C20,-22 34,-44 50,-62 C34,-42 20,-19 14,-1 Z" />
      <path d="M11,0 C25,-15 40,-29 58,-39 C40,-26 24,-12 17,-1 Z" />
      <path d="M2,0 C-12,-14 -22,-27 -29,-42 C-18,-30 -6,-16 6,-2 Z" />
    </g>

    <!-- 百合：花瓣要「反捲」—— 由中心往外張開後，尖端再往回勾。
         這一勾是百合跟星形小花最大的差別。
         再加六根往外噴的花蕊，末端各一顆長形花藥。中心在原點。 -->
    <g id="lily">
      <!-- 花瓣：基部窄、中段展開、尖端收成一點，中間再加一條中脈。
           先前想畫「尖端往回勾」的反捲，結果兩側曲線一收就變成
           圓圓的幸運草 —— 這個尺寸下老實畫成長尖瓣反而像百合。 -->
      <g id="lily-petal">
        <path d="M0,0 C6,-7 8,-16 7,-24 C6,-30 3,-35 0,-38 C-3,-35 -6,-30 -7,-24 C-8,-16 -6,-7 0,0 Z" />
        <path d="M0,-3 C1,-13 1,-25 0,-35" />
      </g>
      <g id="lily-sepal">
        <path d="M0,0 C5,-6 7,-14 6,-21 C5,-26 2,-30 0,-32 C-2,-30 -5,-26 -6,-21 C-7,-14 -5,-6 0,0 Z" />
        <path d="M0,-3 C1,-12 1,-21 0,-29" />
      </g>
      <use href="#lily-sepal" transform="rotate(60)" />
      <use href="#lily-petal" transform="rotate(120)" />
      <use href="#lily-sepal" transform="rotate(180)" />
      <use href="#lily-petal" transform="rotate(240)" />
      <use href="#lily-sepal" transform="rotate(300)" />

      <path d="M0,-3 C3,-14 7,-24 12,-32" />
      <path d="M0,-3 C1,-15 3,-27 5,-38" />
      <path d="M0,-3 C-1,-15 -2,-27 -2,-38" />
      <path d="M0,-3 C-3,-14 -7,-24 -12,-32" />
      <path d="M0,-3 C6,-12 12,-19 19,-24" />
      <path d="M0,-3 C-6,-12 -12,-19 -19,-24" />
      <ellipse cx="13" cy="-34" rx="3.6" ry="1.6" transform="rotate(-34 13 -34)" />
      <ellipse cx="5.6" cy="-40" rx="3.6" ry="1.6" transform="rotate(-12 5.6 -40)" />
      <ellipse cx="-2.2" cy="-40" rx="3.6" ry="1.6" transform="rotate(6 -2.2 -40)" />
      <ellipse cx="-13" cy="-34" rx="3.6" ry="1.6" transform="rotate(34 -13 -34)" />
      <ellipse cx="20.6" cy="-26" rx="3.6" ry="1.6" transform="rotate(-56 20.6 -26)" />
      <ellipse cx="-20.6" cy="-26" rx="3.6" ry="1.6" transform="rotate(56 -20.6 -26)" />
    </g>

    <!-- 一格的配置。五個圖案彼此不重疊，位置與角度都刻意不規則。
         stroke-width 各自 = 1.8 ÷ 放大倍率，這樣不同倍率的圖案
         線條粗細才會一致。 -->
    <g id="tile">
      <use href="#whale" transform="translate(30 200) rotate(-4) scale(5.5)" stroke-width="0.33" />
      <use href="#lily" transform="translate(1120 300) rotate(10) scale(8)" stroke-width="0.225" />
      <use href="#reed" transform="translate(200 1380) rotate(-4) scale(8)" stroke-width="0.225" />
      <use href="#whale" transform="translate(1400 1000) scale(-5.5 5.5) rotate(3)" stroke-width="0.33" />
      <use href="#lily" transform="translate(880 830) rotate(-8) scale(4.5)" stroke-width="0.4" />
    </g>
  </defs>

  <g fill="none" stroke="#8a6a4f" stroke-linecap="round" stroke-linejoin="round">
    <use href="#tile" />
    <use href="#tile" transform="translate(-1400 0)" />
    <use href="#tile" transform="translate(1400 0)" />
    <use href="#tile" transform="translate(0 -1400)" />
    <use href="#tile" transform="translate(0 1400)" />
    <use href="#tile" transform="translate(-1400 -1400)" />
    <use href="#tile" transform="translate(1400 -1400)" />
    <use href="#tile" transform="translate(-1400 1400)" />
    <use href="#tile" transform="translate(1400 1400)" />
  </g>
</svg>
